<!doctype html><html><head><meta charset="utf-8"><title>Narciso CUA test — synthetic data only</title><style>body{font:20px system-ui;max-width:720px;margin:30px auto;background:#fafafa;color:#182238}label{display:block;margin:18px 0}input,select,textarea,button{font:inherit;padding:8px}fieldset label{display:inline-block;margin-right:30px}canvas{display:block;cursor:pointer;border:2px solid #aaa}button{margin-top:22px}</style></head><body><h1>Narciso CUA test</h1><p>Synthetic data only. Nothing is purchased or sent to anyone.</p><form action="/result" method="post"><label>Customer name <input name="name" required></label><fieldset><legend>Pizza size</legend><label><input type="radio" name="size" value="small">Small</label><label><input type="radio" name="size" value="large">Large</label></fieldset><label><input type="checkbox" name="topping" value="bacon">Bacon</label><label>Delivery <select name="delivery"><option value="pickup">Pickup</option><option value="driveway">Driveway</option></select></label><label>Instructions <textarea name="instructions" rows="2"></textarea></label><p>Custom control: click the blue circle to turn the indicator green.</p><canvas id="custom" width="400" height="75" aria-hidden="true"></canvas><input type="hidden" name="custom" id="customValue" value="off"><button>Submit demo</button></form><script>const c=document.querySelector('canvas'),ctx=c.getContext('2d');let on=false;function draw(){ctx.clearRect(0,0,400,75);ctx.fillStyle=on?'#139d52':'#1673ce';ctx.beginPath();ctx.arc(38,38,23,0,Math.PI*2);ctx.fill();ctx.font='20px sans-serif';ctx.fillStyle='#182238';ctx.fillText(on?'Indicator ON':'Indicator OFF',85,46)}c.onclick=e=>{if(e.offsetX<65&&e.offsetY>10&&e.offsetY<65){on=!on;document.getElementById('customValue').value=on?'on':'off';draw()}};draw();</script></body></html>
